name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WASM
        run: dotnet publish RallyHelper.Pwa/RallyHelper.Pwa.csproj -c Release -o ./build

      - name: Verify build output
        run: |
          ls -la ./build/wwwroot
          test -f ./build/wwwroot/index.html
          test -f ./build/wwwroot/service-worker.js
          test -f ./build/wwwroot/_redirects

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            pages deploy ./build/wwwroot \
              --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }} \
              --branch=main \
              --commit-dirty=true
